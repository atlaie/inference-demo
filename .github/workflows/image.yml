# Builds the enclave's image (service/) and publishes it to GHCR with a build provenance attestation,
# so the digest tinfoil-config.yml pins traces back to this repo's source. It makes no GitHub
# release: the latest release must stay the enclave's, made by tinfoil-release.yml.
#
#   gh workflow run image.yml -f tag=v0.1.0
#
# The run summary prints the image reference for tinfoil-config.yml.

name: Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v0.1.0)'
        required: true
        type: string

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # keyless provenance signing
      attestations: write   # publish the provenance

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/inference-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        # vLLM's CUDA image is 9 GB compressed: the build downloads it to push it to GHCR, which takes
        # more space than the runner has free.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: service
          platforms: linux/amd64  # Tinfoil's AMD SEV-SNP hosts
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image for tinfoil-config.yml - \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
