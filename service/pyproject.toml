[project]
name = "sash-inference"
version = "0.1.0"
description = "The verified inference demo's enclave service: serves the evaluated model and signs what it serves"
requires-python = ">=3.12"
# The versions the vLLM CPU image ships (vllm/vllm-openai-cpu v0.31.0), which runs this service
# without installing anything.
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "tinfoil==0.14.0",  # the owner tool's upload to an enclave (sash_inference.owner)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
