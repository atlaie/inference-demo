[project]
name = "inference-service"
version = "0.1.0"
description = "The verified inference demo's enclave service: everything the enclave runs besides vLLM"
requires-python = ">=3.12"
# The versions vLLM's images ship (vllm/vllm-openai and vllm/vllm-openai-cpu v0.31.0), which run this
# service without installing anything.
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
